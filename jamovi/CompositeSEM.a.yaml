---
name: CompositeSEM
title: CompositeSEM
menuGroup: CompositeSEM
version: '1.3.0'
jas: '1.2'
arbitraryCode: false

options:
- name: data
  type: Data
  description:
    R: >
      TO ADD

########################################################################################
- name: latent
  type: Array
  default:
  - label: Latent1
    vars: []
  template:
    type: Group
    elements:
    - name: label
      type: String
    - name: vars
      type: Variables
      suggested:
      - continuous
      - ordinal
      permitted:
      - numeric
      - factor
  description:
    R: >
      A list containing named lists that define the `label` of the latent endogenous variable(s) and
      the `vars` that belong to that latent.
########################################################################################

########################################################################################
- name: composite
  type: Array
  default:
  - label: Composite1
    vars: []
  template:
    type: Group
    elements:
    - name: label
      type: String
    - name: vars
      type: Variables
      suggested:
      - continuous
      - ordinal
      permitted:
      - numeric
      - factor
  description:
    R: >
      A list containing named lists that define the `label` of the composite variables and
      the `vars` that belong to that composite.
########################################################################################

- name: multg
  title: Multigroup Analysis
  type: Variable

########################################################################################
- name: alt
  title: Estimation method
  type: List
  options:
  - title: PLS
    name: PLS
  - title: GSCA
    name: GSCA
  - title: MAXVAR
    name: MAXVAR
  default: PLS
########################################################################################
- name: useBootstrap
  title: Bootstrapping
  type: Bool
  default: false
########################################################################################
- name: bootR
  title: Number of samples
  type: Integer
  min: 50
  max: 5000
  default: 500
########################################################################################
- name: LinearBench
  title: Out-of-sample predictive power
  type: Bool
  default: false

- name: predictFolds
  title: Number of folds
  type: Integer
  min: 2
  max: 100
  default: 10





- name: endogenousClass
  title: Endogenous Constructs
  type: Terms
  default: []
  description:
    R: >
      Constructs classified as endogenous outcomes for directional structural modeling.
########################################################################################

########################################################################################
- name: exogenousClass
  title: Exogenous Constructs
  type: Terms
  default: []
  description:
    R: >
      Constructs classified as exogenous predictors for directional structural modeling.
########################################################################################

########################################################################################
- name: endogenousTerms
  title: Endogenous Variables Models
  type: Array
  default:
  - []
  template:
    type: Terms
  description:
    R: >
      A list of structural predictor term sets, one per construct.
      Each entry corresponds to a latent or composite construct in order.
########################################################################################

- name: exactFit
  title: Exact fit test
  type: Bool
  default: false



- name: showCompositeLoadings
  title: Composite outer loadings
  type: Bool
  default: false



- name: disattenuate
  title: No disattenuation
  type: Bool
  default: false

...
