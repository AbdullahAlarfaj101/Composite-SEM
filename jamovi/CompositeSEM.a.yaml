---
name: CompositeSEM
title: CompositeSEM
menuGroup: SEM
version: '1.7.0'
jas: '1.2'
arbitraryCode: false

options:
- name: data
  type: Data
  description:
    R: >
      TO ADD

########################################################################################

- name: dataCleaningEnabled
  title: Enable handling missing data
  type: Bool
  default: true
  description:
    R: >
      If `TRUE`, the indicator variables used by the defined constructs are cleaned
      (according to `cleaningMethod`) before they are passed on to cSEM.
- name: cleaningMethod
  title: Handling method
  type: List
  options:
  - title: Listwise deletion
    name: listwise
  - title: Mean imputation
    name: mean
  - title: Regression imputation
    name: regression
  - title: K-Nearest Neighbours (KNN) imputation
    name: knn
  default: listwise
  description:
    R: >
      The method used to handle missing values in the indicator variables when
      `dataCleaningEnabled` is `TRUE`.

########################################################################################

- name: latent
  type: Array
  default:
  - label: Latent1
    vars: []
  template:
    type: Group
    elements:
    - name: label
      type: String
    - name: vars
      type: Variables
      suggested:
      - continuous
      - ordinal
      permitted:
      - numeric
      - factor
  description:
    R: >
      A list containing named lists that define the `label` of the latent endogenous variable(s) and
      the `vars` that belong to that latent.

########################################################################################

- name: composite
  type: Array
  default:
  - label: Composite1
    vars: []
  template:
    type: Group
    elements:
    - name: label
      type: String
    - name: vars
      type: Variables
      suggested:
      - continuous
      - ordinal
      permitted:
      - numeric
      - factor
  description:
    R: >
      A list containing named lists that define the `label` of the composite variables and
      the `vars` that belong to that composite.
      
########################################################################################

# NEW in 1.7: Higher-Order Constructs (HOC). Selects the disjoint two-stage
# procedure used by cSEM to estimate hierarchical component models. The value
# is forwarded to cSEM::csem() through its .approach_2ndorder argument:
# "2stage" first estimates the lower-order model and then feeds the resulting
# construct scores into the second-stage model, whereas "mixed" estimates the
# repeated-indicator model and only re-estimates the second stage.
- name: hocApproach
  title: Estimation Approach
  type: List
  options:
  - title: Two-Stage (2stage)
    name: 2stage
  - title: Mixed Approach (mixed)
    name: mixed
  default: 2stage
  description:
    R: >
      The disjoint two-stage procedure used to estimate higher-order constructs. `2stage` estimates the
      lower-order model first and feeds the resulting construct scores into the second stage, `mixed`
      estimates the repeated-indicator model and re-estimates the second stage only. Forwarded to
      `cSEM::csem()` as `.approach_2ndorder`.

# NEW in 1.7: Higher-order construct definitions. An array of
# {label, type, components} groups in which each entry declares one
# higher-order construct, its measurement mode (reflective/latent "=~" or
# composite/formative "<~") and the lower-order constructs (LOCs) that act as
# its components. The list is kept in sync with the defined latent/composite
# constructs by jamovi/js/events.js and is translated into the second-order
# part of the cSEM model syntax by .buildStructural() / .run().
- name: hoc
  type: Array
  default: []
  template:
    type: Group
    elements:
    - name: label
      type: String
    - name: type
      type: List
      options:
      - title: Latent
        name: reflective
      - title: Composite
        name: composite
      default: reflective
    - name: components
      type: Variables
  description:
    R: >
      A list containing named lists that define higher-order constructs (`label`), their measurement type (`type`),
      and the lower-order sub-constructs (`components`) assigned to them.

########################################################################################

- name: multg
  title: Multigroup Analysis
  type: Variable

# NEW in 1.5: Multi-Group Analysis (MGA) test method selectors.
# Each option toggles one of the group-comparison approaches supported by
# cSEM::testMGD(), allowing users to run several MGA tests in a single pass:
# Henseler (PLS-MGA), Sarstedt, Chin (parametric), Keil (parametric, equal
# variances) and Nitzl (parametric, suitable for unequal variances).
- name: mgaHenseler
  title: Henseler (PLS-MGA)
  type: Bool
  default: true

- name: mgaSarstedt
  title: Sarstedt
  type: Bool
  default: false

- name: mgaChin
  title: Chin
  type: Bool
  default: false

- name: mgaKeil
  title: Keil
  type: Bool
  default: false

- name: mgaNitzl
  title: Nitzl (suitable for unequal variances)
  type: Bool
  default: false

########################################################################################

- name: alt
  title: Estimation method
  type: List
  options:
  - title: PLS
    name: PLS
  - title: GSCA
    name: GSCA
  - title: MAXVAR
    name: MAXVAR
  default: PLS
  
########################################################################################

- name: useBootstrap
  title: Bootstrapping
  type: Bool
  default: false
  
########################################################################################

- name: bootR
  title: Number of samples
  type: Integer
  min: 50
  max: 5000
  default: 500
  
# NEW in 1.5: Bootstrap confidence interval type. Selects the CI construction
# method passed to cSEM::summarize() (.ci argument) when bootstrapping is
# enabled: Percentile, Basic, Bias-corrected (BC), or Bias-corrected and
# accelerated (BCa).
- name: bootCI
  title: Bootstrap confidence interval type
  type: List
  options:
    - name: CI_percentile
      title: Percentile
    - name: CI_basic
      title: Basic
    - name: CI_bc
      title: Bias-corrected (BC)
    - name: CI_bca
      title: Bias-corrected and accelerated (BCa)
  default: CI_percentile
  
########################################################################################

- name: LinearBench
  title: Out-of-sample predictive power
  type: Bool
  default: false

- name: predictFolds
  title: Number of folds
  type: Integer
  min: 2
  max: 100
  default: 10

- name: endogenousClass
  title: Endogenous Constructs
  type: Terms
  default: []
  description:
    R: >
      Constructs classified as endogenous outcomes for directional structural modeling.

########################################################################################

- name: exogenousClass
  title: Exogenous Constructs
  type: Terms
  default: []
  description:
    R: >
      Constructs classified as exogenous predictors for directional structural modeling.

########################################################################################

- name: endogenousTerms
  title: Endogenous Variables Models
  type: Array
  default:
  - []
  template:
    type: Terms
  description:
    R: >
      A list of structural predictor term sets, one per construct.
      Each entry corresponds to a latent or composite construct in order.
      
########################################################################################

- name: exactFit
  title: Exact fit test
  type: Bool
  default: false



- name: showCompositeLoadings
  title: Composite outer loadings
  type: Bool
  default: false



- name: disattenuate
  title: No disattenuation
  type: Bool
  default: false

# NEW in 1.5: Robust estimation. When enabled, indicator correlations are
# computed with the Spearman rank correlation (cSEM's .approach_cor_robust
# argument), making the estimation robust against nonnormal data and outliers.
- name: robustEst
  title: Robust estimation via Spearman correlation (for nonnormal data)
  type: Bool
  default: false

# NEW in 1.5: Per-construct PLS weighting modes. An array of
# {construct, mode} pairs (kept in sync with the defined composites by
# jamovi/js/events.js) that is translated into cSEM's .PLS_modes argument,
# so each composite can individually use Mode A (correlation weights) or
# Mode B (regression weights). Applies to PLS estimation only.
- name: modes
  type: Array
  default: []
  template:
    type: Group
    elements:
    - name: construct
      type: String
    - name: mode
      type: List
      options:
      - name: modeA
        title: Mode A
      - name: modeB
        title: Mode B
      default: modeA

# NEW in 1.5: Path diagram (model plot) options. The model is rendered with
# semPlot::semPaths(); the options below control whether the plot is shown,
# node-label abbreviation, layout algorithm, orientation, estimate labels,
# indicator residuals, font size and significance stars.
# UPDATED in 1.7: The diagram is now shown by default, because the path
# diagram has become one of the module's primary outputs.
- name: showPlot
  title: Plot the model
  type: Bool
  default: true

- name: abbreviate
  title: Abbreviate node labels
  type: Bool
  default: true

- name: abbrevLength
  title: Abbreviation length
  type: Integer
  min: 1
  max: 20
  default: 4

- name: plotLayout
  title: Layout
  type: List
  options:
  - name: tree
    title: Tree (Default)
  - name: spring
    title: Spring-embedded (Force-directed)
  default: tree

# UPDATED in 1.7: The diagram orientation values are now self-describing
# identifiers ("left_right", "top_down", "bottom_up", "right_left") instead of
# the numeric semPlot rotation codes ('1'-'4') used up to 1.5. The mapping to
# the numeric semPaths() 'rotation' argument is performed in
# .plotPathDiagram(), which still accepts the legacy numeric values so that
# analyses saved with earlier versions keep rendering correctly.
- name: plotRotation
  title: Direction
  type: List
  options:
  - name: left_right
    title: Left-to-right / Manifests at left (Default)
  - name: top_down
    title: Top-down (tree) / Manifests at top
  - name: bottom_up
    title: Bottom-up / Manifests at bottom
  - name: right_left
    title: Right-to-left / Manifests at right
  default: left_right

# NEW in 1.7: Vertical spacing of the indicator (manifest) nodes in the path
# diagram. The chosen level scales the per-column stacking step applied by
# .plotPathDiagram(), which regroups indicators under their parent construct
# so that blocks no longer interleave or overlap in densely measured models.
- name: plotIndicatorSpacing
  title: Vertical Spacing Gap
  type: List
  options:
  - name: compact
    title: Compact
  - name: normal
    title: Normal
  - name: large
    title: Large
  default: normal
  description:
    R: >
      Vertical spacing between the indicator nodes of the path diagram. Scales the per-column stacking
      step so that indicator blocks stay readable in densely measured models.

- name: showEstimates
  title: Show estimates on paths
  type: Bool
  default: true

- name: showResiduals
  title: Show indicator residuals
  type: Bool
  default: false

- name: plotFontSize
  title: Font size
  type: List
  options:
  - name: small
    title: Small
  - name: medium
    title: Medium (Default)
  - name: large
    title: Large
  default: medium

- name: showSigStars
  title: Show significance stars (* p < .05, ** p < .01, *** p < .001)
  type: Bool
  default: true

########################################################################################

# NEW in 1.7: Moderation (interaction) analysis. When enabled, the product
# term X.M is added automatically to the structural equation of the selected
# dependent construct and the conditional (simple) effect of X on Y is probed
# at several values of the moderator M. The three construct selectors are
# populated dynamically by jamovi/js/events.js: the dependent list contains
# only endogenous constructs, the independent list only the predictors of the
# selected dependent construct, and the moderator list those predictors minus
# the selected independent construct.
- name: moderationEnabled
  title: Enable Moderation Analysis
  type: Bool
  default: false
  description:
    R: >
      Whether a moderation (interaction) analysis is performed. When `TRUE`, the product term
      `modIndependent.modModerator` is added automatically to the structural equation of
      `modDependent` and the conditional effect is probed at the levels given by `modLevels`.

# NEW in 1.7: Dependent construct (Y) of the moderated relationship.
- name: modDependent
  title: Dependent Construct
  type: String
  default: ""
  description:
    R: >
      Name of the endogenous construct that acts as the dependent variable (Y) of the moderated
      relationship.

# NEW in 1.7: Independent construct (X) whose effect on Y is moderated.
- name: modIndependent
  title: Independent Construct
  type: String
  default: ""
  description:
    R: >
      Name of the construct whose effect on `modDependent` is moderated (X).

# NEW in 1.7: Moderator construct (M) that conditions the X -> Y effect.
- name: modModerator
  title: Moderator Construct
  type: String
  default: ""
  description:
    R: >
      Name of the construct that moderates the effect of `modIndependent` on `modDependent` (M).

# NEW in 1.7: Probing levels at which the conditional effect of X on Y is
# evaluated. Because cSEM construct scores are standardised, the standard
# deviation levels correspond to z = -1, 0, +1 and the percentile levels to
# the z-scores of the 16th, 50th and 84th percentile.
- name: modLevels
  title: Moderator Probing Levels
  type: List
  options:
  - name: sd
    title: Standard Deviations (-1 SD, Mean, +1 SD)
  - name: percentile
    title: Percentiles (16th, 50th, 84th)
  default: sd
  description:
    R: >
      Values of the moderator at which the conditional effect is evaluated. Construct scores are
      standardised, so `sd` probes at z = -1, 0 and +1 and `percentile` at the z-scores of the 16th,
      50th and 84th percentile.

# NEW in 1.7: Simple effects (spotlight) table reporting the conditional
# slope, its standard error, t value, p value and 95% confidence interval at
# each probing level of the moderator.
- name: showSimpleEffectsTable
  title: Simple Effects Table
  type: Bool
  default: true
  description:
    R: >
      Whether the simple effects (spotlight) table is reported, giving the conditional slope, its
      standard error, t value, p value and 95% confidence interval at each probing level.

# NEW in 1.7: Simple slopes plot showing the predicted value of Y as a
# function of X at each probing level of the moderator.
- name: showSimpleEffectsPlot
  title: Simple Effects Slope Plot
  type: Bool
  default: false
  description:
    R: >
      Whether the simple slopes plot is produced, showing one predicted regression line of Y on X per
      probing level of the moderator.

# NEW in 1.7: Floodlight (Johnson-Neyman) plot showing the conditional effect
# of X on Y across the full observed range of the moderator, together with its
# 95% confidence band, so the region of significance can be read directly.
- name: showFloodlightPlot
  title: Floodlight (Johnson-Neyman) Plot
  type: Bool
  default: false
  description:
    R: >
      Whether the floodlight (Johnson-Neyman) plot is produced, showing the conditional effect of X on
      Y across the range of the moderator together with its 95% confidence band.

...
