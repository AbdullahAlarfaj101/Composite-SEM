title: Composite-SEM
name: CompositeSEM
jus: '2.0'
stage: 0
events:
  update: './events::update'
children:
  - type: VariableSupplier
    persistentItems: true
    stretchFactor: 1
    suggested:
      - continuous
      - ordinal
    permitted:
      - numeric
    children:
      - type: TargetLayoutBox
        label: Latent
        children:
          - type: ListBox
            name: latent
            height: large
            addButton: Add Latent
            events:
              listItemAdded: './events::onChange_items_changed'
              listItemRemoved: './events::onChange_items_changed'
            template:
              type: LayoutBox
              margin: normal
              children:
                - type: TextBox
                  name: label
                  events:
                    change: './events::onChange_constructName'
                  valueKey:
                    - label
                  borderless: true
                  stretchFactor: 1
                  margin: normal
                - type: VariablesListBox
                  name: vars
                  events:
                    listItemAdded: './events::onChange_items_changed'
                    listItemRemoved: './events::onChange_items_changed'
                  valueKey:
                    - vars
                  isTarget: true
                  height: auto
                  ghostText: drag variables here
      - type: TargetLayoutBox
        label: Composite
        children:
          - type: ListBox
            name: composite
            height: large
            addButton: Add Composite
            events:
              listItemAdded: './events::onChange_items_changed'
              listItemRemoved: './events::onChange_items_changed'
            template:
              type: LayoutBox
              margin: normal
              children:
                - type: TextBox
                  name: label
                  events:
                    change: './events::onChange_constructName'
                  valueKey:
                    - label
                  borderless: true
                  stretchFactor: 1
                  margin: normal
                - type: VariablesListBox
                  name: vars
                  events:
                    listItemAdded: './events::onChange_items_changed'
                    listItemRemoved: './events::onChange_items_changed'
                  valueKey:
                    - vars
                  isTarget: true
                  height: auto
                  ghostText: drag variables here
      - type: TargetLayoutBox
        label: Multigroup Analysis
        children:
          - type: VariablesListBox
            name: multg
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: 'Note: Defining constructs estimates a correlated model automatically.'
        stretchFactor: 1
        margin: small
      - type: Label
        label: "To specify structural relationships, use 'Structural Roles' below."
        stretchFactor: 1
        margin: small
  - type: CollapseBox
    label: Bootstrapping
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: useBootstrap
          - type: TextBox
            name: bootR
            format: number
            enable: (useBootstrap)
          - type: Label
            label: 'Note: Bootstrapping is needed to generate important indices (such as p-value and SE)'
            stretchFactor: 1
            margin: small
  - type: CollapseBox
    label: Model Estimation
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: alt
            events:
              change: './events::onChange_alt'
          - type: CheckBox
            name: disattenuate
  - type: CollapseBox
    label: Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: exactFit
          - type: CheckBox
            name: showCompositeLoadings

  - type: CollapseBox
    label: Structural Roles
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: Label
            name: debugLabel
            label: "If you leave the structural section empty, correlation will be estimated."
            stretchFactor: 1
            margin: small
          - type: Supplier
            label: Defined Constructs
            name: roleSupplier
            format: variable
            persistentItems: true
            stretchFactor: 1
            events:
              update: ./events::onUpdate_roleSupplier
              change: ./events::onChange_roleSupplier
            children:
              - type: TargetLayoutBox
                label: Endogenous Constructs
                children:
                  - type: ListBox
                    name: endogenousClass
                    isTarget: true
                    valueFilter: unique
                    fullRowSelect: true
                    height: large
                    ghostText: drag constructs here
                    events:
                      change: ./events::onChange_roleAssignments
                    template:
                      type: TermLabel
              - type: TargetLayoutBox
                label: Exogenous Constructs
                children:
                  - type: ListBox
                    name: exogenousClass
                    isTarget: true
                    valueFilter: unique
                    fullRowSelect: true
                    height: large
                    ghostText: drag constructs here
                    events:
                      change: ./events::onChange_roleAssignments
                    template:
                      type: TermLabel
  - type: CollapseBox
    label: Directional Paths
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: Label
            label: "Specify directional relationships."
            stretchFactor: 1
            margin: small
          - type: Supplier
            label: Defined Constructs
            name: pathSupplier
            format: variable
            persistentItems: true
            stretchFactor: 1
            events:
              update: ./events::onUpdate_pathSupplier
              change: ./events::onChange_pathSupplier
            children:
              - type: TargetLayoutBox
                label: Endogenous Variables Models
                children:
                  - type: ListBox
                    name: endogenousTerms
                    height: large
                    selectable: true
                    templateName: linreg-block-template
                    template:
                      type: LayoutBox
                      margin: normal
                      targetArea: true
                      children:
                        - type: Label
                          name: blockName
                          label: empty
                          stretchFactor: 1
                          margin: normal
                        - type: ListBox
                          name: blockList
                          isTarget: true
                          valueFilter: unique
                          height: auto
                          ghostText: drag predictors here
                          events:
                            change: ./events::onChange_endogenousTerms
                          template:
                            type: TermLabel
          - type: CheckBox
            name: LinearBench
          - type: TextBox
            name: predictFolds
            format: number
            enable: (LinearBench)

compilerMode: tame
