---
name:  CompositeSEM
title: CompositeSEM
jrs:   '1.1'

# NEW in 1.5: Attach the module's own citation (defined in jamovi/refs.yaml)
# to the analysis so it appears in the References section of the jamovi output.
refs:
    - CompositeSEM
    - cSEM
    - Henseler2021

items:
    # NEW in 1.7: In addition to the formal References entry above, the
    # required citation is now shown directly underneath the first output
    # table, so it stays visible even when the References section is collapsed.
    - name: constructsTable
      title: 'Model Structure Summary'
      type: Table
      notes:
        citation: 'If you use Composite-SEM you must cite it as follows: Al Arfaj, A. A., & Alamer, A. A. (2026). Composite-SEM: A Jamovi Module (Software). https://github.com/AbdullahAlarfaj101/Composite-SEM'
      columns:
        - name: type
          title: 'Construct Type'
          type: text
        - name: construct
          title: 'Construct Name'
          type: text
        - name: indicators
          title: 'Indicators'
          type: text

    - name: cleaningSummaryTable
      title: 'Data Cleaning Summary'
      type: Table
      visible: (dataCleaningEnabled)
      clearWith:
        - data
        - latent
        - composite
        - dataCleaningEnabled
        - cleaningMethod
      columns:
        - name: property
          title: 'Property'
          type: text
        - name: value
          title: 'Value'
          type: text

    - name: infoTable
      title: 'Model Information'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: property
          title: 'Property'
          type: text
        - name: value
          title: 'Value'
          type: text

    - name: fitTable
