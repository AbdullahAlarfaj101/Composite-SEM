        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: construct
          title: 'Construct'
          type: text
        - name: indicator
          title: 'Indicator'
          type: text
        - name: estimate
          title: 'Std estimate'
          type: number
        - name: se
          title: 'SE'
          type: number
          visible: (useBootstrap)
        - name: cil
          title: 'Lower'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: ciu
          title: 'Upper'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
