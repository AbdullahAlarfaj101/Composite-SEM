        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
