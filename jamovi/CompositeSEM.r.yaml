          visible: (useBootstrap)
        - name: ciu
          title: 'Upper'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
          visible: (useBootstrap)
        - name: t
