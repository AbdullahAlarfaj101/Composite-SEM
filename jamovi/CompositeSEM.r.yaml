    # NEW in 1.7: Moderation analysis output group. All results of the
    # interaction analysis are collected in a single group so they can be
    # shown or hidden together with the 'Enable Moderation Analysis' option.
    - name: moderationGroup
      title: 'Moderation Analysis'
      type: Group
      visible: (moderationEnabled)
      items:
        # NEW in 1.7: Spotlight/simple effects table. Reports the conditional
        # slope of X on Y, its standard error, t value, p value and 95%
        # confidence interval at each selected level of the moderator.
        - name: simpleEffectsTable
          title: 'Simple Effects Analysis'
          type: Table
          visible: (moderationEnabled)
          clearWith:
            - data
            - latent
            - composite
            - moderationEnabled
            - modDependent
            - modIndependent
            - modModerator
            - modLevels
            - useBootstrap
            - bootR
            - bootCI
            - alt
          columns:
            - name: level
              title: 'Moderator Level'
              type: text
            - name: modValue
              title: 'Moderator Value (z)'
              type: number
            - name: slope
              title: 'Conditional Slope (Estimate)'
              type: number
            - name: se
              title: 'SE'
              type: number
            - name: t
              title: 't'
              type: number
            - name: p
              title: 'p-value'
              type: number
              format: zto,pvalue
            - name: cil
              title: 'Lower'
              type: number
              superTitle: '95% Confidence Interval'
            - name: ciu
              title: 'Upper'
              type: number
              superTitle: '95% Confidence Interval'

        # NEW in 1.7: Simple slopes plot. Draws the predicted value of the
        # dependent construct against the independent construct, with one
        # regression line per probing level of the moderator.
        - name: simpleEffectsPlot
          title: 'Simple Effects Slope Plot'
          type: Image
          width: 600
          height: 400
          renderFun: .plotSimpleEffects
          visible: (moderationEnabled && showSimpleEffectsPlot)
          clearWith:
            - data
            - latent
            - composite
            - moderationEnabled
            - modDependent
            - modIndependent
            - modModerator
            - modLevels
            - useBootstrap

        # NEW in 1.7: Floodlight (Johnson-Neyman) plot. Draws the conditional
        # effect of X on Y across the whole range of the moderator together
        # with its 95% confidence band and a reference line at zero, so the
        # region of significance can be read directly from the figure.
        - name: floodlightPlot
          title: 'Floodlight (Johnson-Neyman) Plot'
          type: Image
          width: 600
          height: 400
          renderFun: .plotFloodlight
          visible: (moderationEnabled && showFloodlightPlot)
          clearWith:
            - data
            - latent
            - composite
            - moderationEnabled
            - modDependent
            - modIndependent
            - modModerator
            - useBootstrap

    # NEW in 1.5: Path diagram of the estimated model, rendered with
    # semPlot::semPaths() via the .plotPathDiagram render function.
    # (The legacy 'csemOutput' preformatted text element was removed in 1.5,
    # as its multigroup content is now presented in the MGA tables above.)
    # UPDATED in 1.7: Renamed to 'SEM Diagram' and enlarged, since the render
    # function now also draws higher-order constructs and interaction terms
    # and applies construct-grouped indicator stacking.
    - name: pathPlot
      title: 'SEM Diagram'
      type: Image
      width: 750
      height: 600
      renderFun: .plotPathDiagram
      visible: (showPlot)
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
        - modes
        - showPlot
        - plotLayout
        - plotRotation
        - plotIndicatorSpacing
        - plotFontSize
        - showEstimates
        - showResiduals
        - showSigStars
        - abbreviate
        - abbrevLength
        - dataCleaningEnabled
        - cleaningMethod
        - hoc
        - hocApproach
        - moderationEnabled
        - modDependent
        - modIndependent
        - modModerator

