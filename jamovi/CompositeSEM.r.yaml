---
name:  CompositeSEM
title: CompositeSEM
jrs:   '1.1'

# NEW in 1.5: Attach the module's own citation (defined in jamovi/refs.yaml)
# to the analysis so it appears in the References section of the jamovi output.
refs:
    - CompositeSEM
    - cSEM
    - Henseler2021

items:
    - name: constructsTable
      title: 'Model Structure Summary'
      type: Table
      columns:
        - name: type
          title: 'Construct Type'
          type: text
        - name: construct
          title: 'Construct Name'
          type: text
        - name: indicators
          title: 'Indicators'
          type: text

    - name: cleaningSummaryTable
      title: 'Data Cleaning Summary'
      type: Table
      visible: (dataCleaningEnabled)
      clearWith:
        - data
        - latent
        - composite
        - dataCleaningEnabled
        - cleaningMethod
      columns:
        - name: property
          title: 'Property'
          type: text
        - name: value
          title: 'Value'
          type: text

    - name: infoTable
      title: 'Model Information'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: property
          title: 'Property'
          type: text
        - name: value
          title: 'Value'
          type: text

    - name: fitTable
      title: 'Model Fit Indices'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: metric
          title: 'Metric'
          type: text
        - name: value
          title: 'Value'
          type: number

    - name: exactFitTable
      title: 'Exact Fit Test'
      type: Table
      visible: false
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - exactFit
        - disattenuate
        - robustEst
        - endogenousClass
        - exogenousClass
        - endogenousTerms
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: measure
          title: 'Distance measure'
          type: text
        - name: stat
          title: 'Test statistic'
          type: number
        - name: crit
          title: 'Critical value (95%)'
          type: number
        - name: decision
          title: 'Decision'
          type: text

    - name: outerCompositesTable
      title: 'Outer Model of Composites'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
        - showCompositeLoadings
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: construct
          title: 'Construct'
          type: text
        - name: indicator
          title: 'Indicator'
          type: text
        - name: relation
          title: 'Relation'
          type: text
          visible: (showCompositeLoadings)
        - name: estimate
          title: 'Std estimate'
          type: number
        - name: se
          title: 'SE'
          type: number
          visible: (useBootstrap)
        - name: cil
          title: 'Lower'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: ciu
          title: 'Upper'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
          visible: (useBootstrap)
        - name: t
          title: 't'
          type: number
          visible: (useBootstrap)

    - name: outerCommonFactorsTable
      title: 'Outer Model of Common Factors'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: construct
          title: 'Construct'
          type: text
        - name: indicator
          title: 'Indicator'
          type: text
        - name: estimate
          title: 'Std estimate'
          type: number
        - name: se
          title: 'SE'
          type: number
          visible: (useBootstrap)
        - name: cil
          title: 'Lower'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: ciu
          title: 'Upper'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
          visible: (useBootstrap)
        - name: t
          title: 't'
          type: number
          visible: (useBootstrap)

    - name: reliabilityTable
      title: 'Construct Reliability (Common Factors)'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: construct
          title: 'Construct'
          type: text
        - name: alpha
          title: "Cronbach's alpha (α)"
          type: number
        - name: rhoC
          title: "Jöreskog's rho (ω)"
          superTitle: "Composite Reliability"
          type: number
        - name: rhoA
          title: "Dijkstra-Henseler's rho (ρA)"
          superTitle: "Composite Reliability"
          type: number
        - name: ave
          title: 'AVE'
          type: number

    - name: htmtTable
      title: 'Discriminant Validity (HTMT & HTMT2)'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: c1
          title: 'Construct 1'
          type: text
        - name: c2
          title: 'Construct 2'
          type: text
        - name: htmt
          title: 'HTMT'
          type: number
        - name: htmt2
          title: 'HTMT2'
          type: number

    - name: vifModeBTable
      title: 'Variance Inflation Factors (VIFs) for Mode B Weights'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: construct
          title: 'Construct'
          type: text
        - name: indicator
          title: 'Indicator'
          type: text
        - name: vif
          title: 'VIF Value'
          type: number

    - name: vcvTable
      title: 'Construct Correlations'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: c1
          title: 'Construct 1'
          type: text
        - name: c2
          title: 'Construct 2'
          type: text
        - name: estimate
          title: 'Correlation'
          type: number
        - name: se
          title: 'SE'
          type: number
        - name: cil
          title: 'Lower'
          type: number
          superTitle: '95% Confidence Interval'
        - name: ciu
          title: 'Upper'
          type: number
          superTitle: '95% Confidence Interval'
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: t
          title: 't'
          type: number

    - name: structuralTable
      title: 'Inner Model (Structural Relationships)'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: rhs
          title: 'Predictor'
          type: text
        - name: lhs
          title: 'Outcome'
          type: text
        - name: estimate
          title: '<i>β</i>'
          type: number
        - name: se
          title: 'SE'
          type: number
          visible: (useBootstrap)
        - name: cil
          title: 'Lower'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: ciu
          title: 'Upper'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
          visible: (useBootstrap)
        - name: t
          title: 't'
          type: number
          visible: (useBootstrap)
        - name: r2
          title: 'R²'
          type: number
        - name: r2adj
          title: 'Adj. R²'
          type: number

    - name: mediationTable
      title: 'Indirect and Total Effects'
      type: Table
      visible: false
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: type
          title: 'Effect Type'
          type: text
        - name: rhs
          title: 'Predictor'
          type: text
        - name: lhs
          title: 'Outcome'
          type: text
        - name: estimate
          title: '<i>β</i>'
          type: number
        - name: se
          title: 'SE'
          type: number
          visible: (useBootstrap)
        - name: cil
          title: 'Lower'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: ciu
          title: 'Upper'
          type: number
          superTitle: '95% Confidence Interval'
          visible: (useBootstrap)
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
          visible: (useBootstrap)
        - name: t
          title: 't'
          type: number
          visible: (useBootstrap)

    - name: predictTable
      title: 'Model''s Out-of-Sample Predictive Power'
      type: Table
      visible: (LinearBench)
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
        - predictFolds
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: indicator
          title: 'Indicator'
          type: text
        - name: maeTarget
          title: 'MAE PLS'
          type: number
        - name: maeBench
          title: 'MAE LM'
          type: number
        - name: rmseTarget
          title: 'RMSE PLS'
          type: number
        - name: rmseBench
          title: 'RMSE LM'
          type: number
        - name: q2
          title: 'Q² predict'
          type: number

    # NEW in 1.5: Structured Multi-Group Analysis output. The three tables
    # below (overall decision, run overview/metadata, and per-parameter
    # comparison results) replace the raw preformatted text dump of
    # cSEM::testMGD() that was used in earlier versions.
    - name: mgaDecisionTable
      title: 'Multi-Group Analysis - Overall Decision (α = 5%)'
      type: Table
      visible: (multg)
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: test
          title: 'Test Method'
          type: text
        - name: decision
          title: 'Decision (α = 5%)'
          type: text

    - name: mgaOverviewTable
      title: 'Multi-Group Analysis - Run Overview'
      type: Table
      visible: (multg)
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: property
          title: 'Run Metadata / Parameter'
          type: text
        - name: value
          title: 'Value'
          type: text

    - name: mgaTable
      title: 'Multi-Group Comparison Test Results'
      type: Table
      visible: (multg)
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
      columns:
        - name: comparison
          title: 'Comparison Pair'
          type: text
        - name: parameter
          title: 'Parameter'
          type: text
        - name: test
          title: 'Test Method'
          type: text
        - name: stat
          title: 'Test Statistic'
          type: number
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: decision
          title: 'Decision (α = 5%)'
          type: text

    # NEW in 1.5: Path diagram of the estimated model, rendered with
    # semPlot::semPaths() via the .plotPathDiagram render function.
    # (The legacy 'csemOutput' preformatted text element was removed in 1.5,
    # as its multigroup content is now presented in the MGA tables above.)
    - name: pathPlot
      title: 'Path Diagram'
      type: Image
      width: 600
      height: 450
      renderFun: .plotPathDiagram
      visible: (showPlot)
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
        - modes
        - showPlot
        - plotLayout
        - plotRotation
        - showEstimates
        - showResiduals
        - plotFontSize
        - showSigStars
        - abbreviate
        - abbrevLength
        - dataCleaningEnabled
        - cleaningMethod

...
