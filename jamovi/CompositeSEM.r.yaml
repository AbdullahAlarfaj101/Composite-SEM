        - name: stat
          title: 'Test statistic'
          type: number
        - name: crit
          title: 'Critical value (95%)'
          type: number
        - name: decision
          title: 'Decision'
          type: text

    - name: outerCompositesTable
      title: 'Outer Model of Composites'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
        - endogenousClass
        - exogenousClass
        - endogenousTerms
        - disattenuate
        - robustEst
        - showCompositeLoadings
      columns:
        - name: group
          title: 'Group'
          type: text
          visible: (multg)
        - name: construct
          title: 'Construct'
          type: text
        - name: indicator
          title: 'Indicator'
          type: text
        - name: relation
          title: 'Relation'
          type: text
          visible: (showCompositeLoadings)
        - name: estimate
          title: 'Std estimate'
          type: number
        - name: se
          title: 'SE'
          type: number
          visible: (useBootstrap)
        - name: cil
          title: 'Lower'
          type: number
