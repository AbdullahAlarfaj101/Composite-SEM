          type: number
          visible: (useBootstrap)

    # NEW in 1.7: Dedicated outer model table for higher-order constructs.
    # When a hierarchical component model is estimated, the second-stage
    # relations between each higher-order construct and its lower-order
    # components are reported here instead of being mixed into the ordinary
    # composite/common-factor outer model tables: reflective HOCs contribute
    # their loadings, formative HOCs their weights.
    - name: outerHocTable
      title: 'Outer Model of Higher-Order Constructs (HOC)'
      type: Table
      clearWith:
        - data
        - latent
        - composite
        - hoc
        - multg
        - alt
        - useBootstrap
        - bootR
        - bootCI
        - LinearBench
